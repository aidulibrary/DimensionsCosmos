name = "dimensions-cosmos-auth"
main = "token-auth.js"
compatibility_date = "2024-12-01"

[vars]
# Secret: 在 Cloudflare Dashboard → Workers & Pages → 选择此 Worker → Settings → Variables → Secrets
# 或通过 CLI: wrangler secret put WORKER_SECRET
# WORKER_SECRET = "your-random-secret-here"  ← 不要明文写在这里，用 secret 设置

[[routes]]
pattern = "dimensions-cosmos.pages.dev/api/*"
zone_name = ""  # 留空表示不绑定 zone，仅通过 workers.dev 子域名访问