name: ingest-deploy

# DimensionsCosmos 全自动管线：文本抓取 → AI 解读 → 前端数据生成 → 构建部署
# 触发：每周一凌晨 2:00 UTC + 手动触发 + push 到 main 时

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]

permissions:
  contents: write
  deployments: write
  issues: write

jobs:
  fetch-and-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pip install -r requirements.txt
      - run: npm ci

      # 阶段 1: 抓取 Wikisource 文本
      - name: fetch wikisource texts
        run: python pipeline/run.py

      # 阶段 2: AI 解读（仅当有 API Key 时运行）
      - name: generate AI guides
        if: ${{ env.GEMINI_API_KEY != '' || env.GROQ_API_KEY != '' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python pipeline/run_ai.py --method zhuxi,feynman,socratic,adler,qianzhongshu || echo "AI processing skipped (no key or rate limited)"

      # 阶段 3: 生成前端数据
      - name: generate frontend data
        run: node scripts/gen-data.mjs

      # 阶段 4: Astro 构建
      - name: build Astro site
        run: npx astro build

      # 阶段 5: 提交更新
      - name: commit changes
        run: |
          git config user.name "guji-bot"
          git config user.email "guji-bot@users.noreply.github.com"
          git add data/ public/data/ dist/ scripts/task-manager.mjs 2>/dev/null || true
          git commit -m "ci: weekly ingest + AI + build $(date +%F)" || echo "no changes"
          git push

      # 阶段 6: 部署 —— 已停用（保留配置备查，不删除）
      # 原因：Cloudflare Pages 已通过 Git 集成在每次 push 时自动构建并部署，
      #       本步骤属重复通道，与 Git 集成争抢同一生产环境（后完成者覆盖先完成者），
      #       且因 project-name / CF_API_TOKEN 长期失败，持续产生误导性红叉。
      # 如需恢复：删除下面 if: false，并先把 --project-name 改为 Cloudflare 实际项目名
      #       同时确认 secrets.CF_API_TOKEN / CF_ACCOUNT_ID 有效。
      - name: deploy to Cloudflare Pages (disabled)
        if: false
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: pages deploy dist/ --project-name=dimensions-cosmos

      # 阶段 7: 失败告警 —— 任何步骤失败时创建/追加一个 issue
      # 目的：把"构建失败"从只有偶然点开 Actions 才能发现，变成仓库里可见的信号
      - name: notify failure via issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const marker = 'CI 失败：ingest-deploy';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `工作流 \`${context.workflow}\` 在 \`${context.ref}\` 执行失败。`,
              '',
              `- 提交：\`${context.sha.slice(0, 7)}\``,
              `- 运行记录：${runUrl}`,
              '',
              '常见原因：抓取源异常导致 \`generate frontend data\` 失败、Astro 构建报错、或数据提交推送冲突。',
              '处理后可关闭本 issue。',
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              per_page: 50,
            });
            const existing = open.data.find((i) => i.title.startsWith(marker));
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已追加评论到 issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                ...context.repo,
                title: `${marker}（${new Date().toISOString().slice(0, 10)}）`,
                body,
              });
              core.info(`已创建 issue #${created.data.number}`);
            }
